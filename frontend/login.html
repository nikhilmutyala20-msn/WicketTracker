<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Wicket Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Arial, sans-serif;

            background: #000;
            color: #e7e7e7;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.85)
                ),
                url("background.png");

            background-size: cover;
            background-position: center;

            z-index: -2;
        }

        /* Purple glow */
        .glow {
            position: fixed;
            width: 450px;
            height: 450px;

            background: #6f00ff;
            filter: blur(180px);

            opacity: 0.18;

            right: -100px;
            top: -100px;

            z-index: -1;
        }

        /* Login box */
        .login-container {
            width: 420px;
            max-width: 90%;

            padding: 40px;

            background: rgba(10, 10, 10, 0.88);

            border: 1px solid rgba(140, 63, 192, 0.5);

            border-radius: 20px;

            box-shadow:
                0 0 40px rgba(111, 0, 255, 0.2);

            backdrop-filter: blur(15px);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 10px;

            font-size: 2.2rem;
            font-weight: 600;

            background: linear-gradient(
                90deg,
                #ffffff,
                #9b4dff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        /* Input */
        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;

            font-size: 0.9rem;
            color: #bbb;
        }

        .input-group input {
            width: 100%;

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid #333;

            background: #111;

            color: white;

            outline: none;

            font-size: 1rem;

            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #8c3fc0;

            box-shadow:
                0 0 10px rgba(140, 63, 192, 0.3);
        }

        /* Main login button */
        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #6a00ff,
                #9b3cff
            );

            color: white;

            font-size: 1rem;

            font-weight: 600;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 20px rgba(140, 63, 192, 0.5);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin: 25px 0;

            color: #666;

            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #333;
        }

        /* Other login buttons */
        .other-btn {
            width: 100%;

            padding: 12px;

            margin-bottom: 12px;

            border-radius: 10px;

            border: 1px solid #333;

            background: #111;

            color: #eee;

            font-size: 0.95rem;

            cursor: pointer;

            transition: 0.3s;
        }

        .other-btn:hover {
            background: #1b1b1b;

            border-color: #8c3fc0;

            transform: translateY(-1px);
        }

        /* Back */
        .back {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: #888;

            text-decoration: none;

            font-size: 0.9rem;
        }

        .back:hover {
            color: white;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .login-container {
                padding: 28px 22px;
            }

            .logo {
                font-size: 1.9rem;
            }
        }
    </style>

</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Purple Glow -->
    <div class="glow"></div>


    <!-- LOGIN CONTAINER -->
    <div class="login-container">

        <!-- Logo -->
        <div class="logo">
            Wicket Tracker
        </div>

        <p class="subtitle">
            Sign in to continue
        </p>


        <!-- EMAIL + PASSWORD -->

        <form action="upload.html">

            <!-- Email -->
            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Sign In -->
            <button
                type="submit"
                class="login-btn">

                Sign In

            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">
            OR
        </div>


        <!-- GOOGLE -->

        <button
            type="button"
            class="other-btn"
            onclick="googleLogin()">

            Continue with Google

        </button>


        <!-- PHONE -->

        <button
            type="button"
            class="other-btn"
            onclick="phoneLogin()">

            Continue with Phone Number

        </button>


        <!-- BACK -->

        <a
            href="index.html"
            class="back">

            ← Back to Home

        </a>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        // Google Login
        function googleLogin() {

            // Demo navigation
            window.location.href = "upload.html";

        }


        // Phone Login
        function phoneLogin() {

            // Demo navigation
            window.location.href = "upload.html";

        }

    </script>

</body>

</html>
